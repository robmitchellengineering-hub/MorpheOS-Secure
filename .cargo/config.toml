# The real target is AArch64 (Raspberry Pi 5). `x86_64-unknown-none` is kept because the loader work on it is real
# and measured; it is not the destination.
[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tcore/linker-arm64.ld",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
    "-C", "panic=abort",
]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tcore/linker.ld",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
    "-C", "panic=abort",
]
