[package]
name = "morph-program"
version = "0.0.1"
edition = "2024"
description = "A real compiled loadable program for the Core's loader: four syscalls and a return."

[[bin]]
name = "morph-program"
path = "src/main.rs"

[dependencies]
# Vendored from airmatrix's rob-core (the full wire-format crate) so the program
# builds the AMT/ROB-shaped RTP header with the engine's own code.
rob-core = { path = "../crates/rob-core" }
# The mix engine itself, vendored with its no_std closure.
rob-engine = { path = "../crates/rob-engine" }
# The engine's own API surfaces the program drives directly.
rob-node = { path = "../crates/rob-node" }
rob-matrix = { path = "../crates/rob-matrix" }

[features]
# The net gate's --self-test mutation: the program emits a wrong SSRC, so the
# gate's engine-RTP check (SSRC 0xC0FFEE00) must go red. The engine packet is
# built here, not by the Core, so its mutation must be here too.
rtp-mutant-wrong-ssrc = []
# The self-check mutation: report one fewer test passed than actually did, so
# the gate's "6/6 RTP self-checks passed" check must go red.
selfcheck-mutant-wrong-count = []
# The engine mutation: emit the mix engine's output under a wrong SSRC, so the
# gate's engine check (SSRC 0x0000000B) must go red.
engine-mutant-wrong-ssrc = []

[profile.release]
panic = "abort"
