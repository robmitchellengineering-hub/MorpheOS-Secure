[package]
name = "morph-program"
version = "0.0.1"
edition = "2024"
description = "A real compiled loadable program for the Core's loader: four syscalls and a return."

[[bin]]
name = "morph-program"
path = "src/main.rs"

[dependencies]
# Vendored from airmatrix's rob-core (rtp module) so the program builds the
# AMT/ROB-shaped RTP header with the engine's own wire-format code.
rob-core = { path = "../crates/rob-core" }

[features]
# The net gate's --self-test mutation: the program emits a wrong SSRC, so the
# gate's engine-RTP check (SSRC 0xC0FFEE00) must go red. The engine packet is
# built here, not by the Core, so its mutation must be here too.
rtp-mutant-wrong-ssrc = []

[profile.release]
panic = "abort"
