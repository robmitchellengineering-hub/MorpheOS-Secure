[package]
name = "morph-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Core of MorpheOS Secure: a capability microkernel. Rung M0: it runs, and says so."

[[bin]]
name = "morph-core"
path = "src/main.rs"

# No dependencies. A Core that pulls a crate graph on its first rung has already stopped being auditable.
[dependencies]

[features]
# The mutation for M1's falsifier: grant `task_bench` the object it must be refused. If `scripts/m1.sh --self-test`
# still passes with this on, the test is checking a string and not the Core's table.
m1-mutant-grant = []
# M2's falsifier hooks: `m2-test-tamper` corrupts a generation in place (the attack), and
# `m2-mutant-skip-verify` disables verification (the mutation that must make the check go red).
m2-test-tamper = []
m2-mutant-skip-verify = []
# The mutation for M2b's falsifier: accept a double free (the classic way a free list aliases memory).
m2b-mutant-allow-double-free = []
# The mutation for M3a: map the guard page too, so the fault that must happen does not.
mmu-mutant-map-guard = []
# The mutation for M4a: do not switch stacks — run the task on the Core's own stack. The task's
# "own stack" line must then disappear (or the Core's state be corrupted), so the check goes red.
task-mutant-no-switch = []
# The mutation for M4b: give the task the Core's own tables, so the private block IS reachable and
# the violation the check requires cannot happen.
task-mutant-share-tables = []
# The mutation for M5a: a clock that never advances, so a deadline check that passes is reading a constant.
tick-mutant-frozen = []
# M5b's mutation: arm the timer so far out that it cannot fire inside the test.
tick-mutant-armed-far = []
# M5c's policy mutation: always pick task 0, which looks like a scheduler and never runs anything else.
sched-mutant-always-first = []
# M5c's switch mutation: record the intent, answer with the same frame. The machine looks alive and never runs
# anything else, so only a line that cannot print unless another context ran will catch it.
sched-mutant-no-switch = []
# The two-task preemption demo. The boot does not run it unless this is on: task A never returns, so an
# always-on demo made every other gate's boot stop before its own lines.
preempt-demo = []
# M5d's mutation: ignore priority and round-robin, which looks like a scheduler and lets a lower class take the
# audio class's CPU.
sched-mutant-ignore-priority = []
# M7a's mutation: accept every certificate. The over-budget case must then be admitted and the gate must go red.
cert-mutant-skip-check = []
# M7c's mutation: allow a derivation to widen, the one thing authority must never do.
cap-mutant-widen = []
# M7d's mutation: trust a box's claim without checking it, the exact mistake admission exists to forbid.
box-mutant-trust-claim = []
fdt-mutant-skip-walk = []
