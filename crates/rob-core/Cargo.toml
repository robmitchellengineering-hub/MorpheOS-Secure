[package]
name = "rob-core"
version = "0.1.0"
edition = "2021"
description = "Vendored rob-core (rtp only) from the AirMatrix repo — the wire format the loadable program builds."
license = "LicenseRef-Proprietary"
rust-version = "1.81"

[dependencies]
# Float rounding/transcendentals for no_std (rob-core uses round in aes67; the
# vendored rtp module does not, but the full crate does — keep the parity).
libm = "0.2"

[lints]
unsafe_code = "forbid"
