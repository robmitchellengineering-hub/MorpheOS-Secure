[package]
name = "rob-dsp"
version = "0.1.0"
edition = "2021"
description = "Vendored from airmatrix's rob-dsp (branch task/no-std-engine) — the no_std engine closure for the MorpheOS-Secure Core."
license = "LicenseRef-Proprietary"
rust-version = "1.81"

[dependencies]
libm = "0.2"

# The vendored copy drops the optional serde dependency; the feature is declared
# empty so the `#[cfg_attr(feature = "serde", …)]` derives in the source are
# never compiled and no unexpected-cfg warning is raised.
[features]
serde = []

[lints.rust]
unsafe_code = "forbid"
