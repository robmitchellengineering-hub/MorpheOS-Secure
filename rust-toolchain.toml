# The estate's exact toolchain, plus both bare-metal targets: aarch64 is the real one (Raspberry Pi 5), x86_64 is
# the bring-up path kept for the loader work already done.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-none", "x86_64-unknown-none"]
profile = "minimal"
